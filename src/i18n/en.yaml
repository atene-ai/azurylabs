about:
  hero:
    title: "Mission"
    subtitle: "Empower sales teams by eliminating noise and inefficiency. Our mission is to deploy autonomous AI agents that centralize, profile, and reactivate leads across all channels, delivering only ready-to-close opportunities to humans."
    quote: "“Transforming disconnected leads into imminent closes via autonomous artificial intelligence.”"
  vision:
    title: "Vision"
    text: "To become the central nervous system of modern sales, redefining the standard of customer service where immediacy and personalization are the norm, and where no business opportunity is lost due to lack of human capacity."
  values:
    title: "Values"
    v1:
      title: "Radical Immediacy"
      desc: "Time is the most expensive asset in sales."
    v2:
      title: "Clarity over Noise"
      desc: "We hate inefficiency and disorder."
    v3:
      title: "Organic Omnipresence"
      desc: "We are where the customer is, without being invasive."
    v4:
      title: "Excellence Standardization"
      desc: "Quality of service should not depend on human mood."
  personality:
    title: "Brand Personality"
    items:
      p1:
        title: "Technical Authority (The Sage)"
        desc: "Speaks with precision. Doesn't 'believe' a lead is good; profiles it with data. An expert brand in efficiency and workflows."
      p2:
        title: "Sophisticated Simplicity (The Magician)"
        desc: "Internal technology is complex, but user experience is magical and fluid. Transforms 'noise' into 'opportunities' almost invisibly."
      p3:
        title: "Human Empowerment"
        desc: "Doesn't seek to replace the salesperson, but turn them into a 'super-closer'. An allied brand, warm in treatment but relentless in execution."
    slogan: "We manage the complexity; you close the deal."
  tone:
    title: "Tone and Voice"
    desc: "We are not a simple chatbot; we are Sales Infrastructure. We are the 'brain' that filters, qualifies, and reactivates, allowing humans to focus on closing."
