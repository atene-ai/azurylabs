faq:
  badge: "Frequently asked questions"
  title: "What people usually ask<br /><span class='faq__title--accent'>about Azury Labs.</span>"
  items:
    - q: "What is Azury Labs?"
      a: "Azury Labs is a software company specialized in applied artificial intelligence. We build our own products and custom solutions so companies can sell, operate and decide with data. We have a presence in Mexico, Colombia and the United States."
    - q: "What products does Azury Labs offer?"
      a: "Eight lines: Atenea (AI agents for real-time messaging and voice), Lindex (autonomous software engineering), Sales OS (omnichannel CRM), Mi Negocio (customers, quotes and orders management), CIEE (surveys and research), Systems (custom software and consulting), Connect (official WhatsApp API) and Tracking System (analytics from first contact to sale)."
    - q: "What is Iruz Atenea and which channels does it work on?"
      a: "Atenea is the platform we use to create AI agents that handle messages and voice in real time, understand your business and connect to your systems to execute real processes. It integrates with WhatsApp Business, Telegram, Instagram Messenger, phone calls and Google Calendar."
    - q: "What is Lindex?"
      a: "Lindex is an autonomous software engineering harness: it coordinates AI agents from a ticket to code, tests and a deployed preview. It runs in an isolated environment, logs every action and lets you set a maximum budget per task. It connects with Linear, Jira, GitHub, GitLab and Cloudflare Pages."
    - q: "What is Iruz Connect?"
      a: "Iruz Connect is the official WhatsApp API for businesses and applications. It handles the Meta integration, credentials, webhooks and message statuses so your team can send and receive WhatsApp messages from its own platform or from Atenea. Instagram, Messenger, SMS, RCS and voice are the next channels."
    - q: "What is Iruz Tracking System?"
      a: "It is product analytics that measures every step of the customer journey, from the first contact to the sale. With trackable links and QR codes you can see which campaign, channel or QR generates leads, appointments and sales, and where customers drop off."
    - q: "How is Sales OS different from a traditional CRM?"
      a: "Sales OS connects your channels, AI agents and human team in a single omnichannel conversation to serve, qualify and follow up on every opportunity, instead of just storing contacts."
    - q: "Does Azury Labs build custom software?"
      a: "Yes. Iruz Systems designs and develops the software your operation needs when an off-the-shelf tool is no longer enough, with technology consulting and guided implementation."
    - q: "How can I get started?"
      a: "Reach out through the contact page or the chat on this site and tell us the challenge. We will guide you to the product or custom solution that fits best."

