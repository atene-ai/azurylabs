    title: "Values"
    v1:
      title: "Utility before novelty"
      desc: "Technology matters when it solves a real problem and enables a better outcome."
    v2:
      title: "Clarity to decide"
      desc: "We turn scattered information into signals, priorities and actionable decisions."
    v3:
      title: "AI with human judgment"
      desc: "We design intelligence that expands people’s capacity and respects their judgment."
    v4:
      title: "Measurable impact"
      desc: "Technology should translate into productivity, learning and observable progress."
