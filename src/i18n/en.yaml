    quote: "“Applied AI for what matters most.”"
  team:
    badge: "Team"
    title: "Who's behind Iruz Labs"
    subtitle: "The people who design useful products, intelligence and experiences behind Iruz."
  ecosystem:
    badge: "Ecosystem"
    title: "Our Products"
    subtitle: "An ecosystem of applied AI products and professional services that turns scattered signals into decisions, actions and more productive operations."
    cta: "Visit"
    items:
      atenea:
        name: "Iruz Atenea"
        desc: "Our AI agent creation engine: the technology base we build every custom assistant on."
      crm:
        name: "Iruz Sales OS"
        desc: "The omnichannel sales operating system that connects channels, AI agents and human teams to advance every opportunity."
      minegocio:
        name: "Iruz My Business"
        desc: "An AI-powered omnichannel operation that centralizes customer conversations and accelerates sales."
      ciee:
        name: "Iruz CIEE"
        desc: "Data analysis and research: AI-driven surveys, popularity studies, and political and market polling."
      systems:
        name: "Iruz Systems"
        desc: "Custom software development, consulting, and professional services for individuals and businesses."
