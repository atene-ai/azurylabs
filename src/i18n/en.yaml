      p1:
        title: "Technical authority"
        desc: "We explain precisely how intelligence, data and software solve business problems."
      p2:
        title: "Sophisticated simplicity"
        desc: "The technology behind the scenes may be complex; the team experience should feel clear and natural."
      p3:
        title: "Human Empowerment"
        desc: "AI expands team capacity so every person can intervene with better judgment."
    slogan: "Intelligence that becomes progress."
