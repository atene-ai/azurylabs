about:
  hero:
    title: "Misión"
    subtitle: "Potenciar a los equipos de ventas eliminando el ruido y la ineficiencia. Nuestra misión es desplegar agentes de IA autónomos que centralizan, perfilan y reactivan leads en todos los canales, entregando a los humanos únicamente oportunidades listas para cerrar."
    quote: "“Transformar leads desconectados en cierres inminentes mediante inteligencia artificial autónoma.”"
  vision:
    title: "Visión"
    text: "Convertirnos en el sistema nervioso central de las ventas modernas, redefiniendo el estándar de atención al cliente donde la inmediatez y la personalización son la norma, y donde ninguna oportunidad de negocio se pierde por falta de capacidad humana."
  values:
    title: "Valores"
    v1:
      title: "Inmediatez Radical"
      desc: "El tiempo es el activo más caro en ventas."
    v2:
      title: "Claridad sobre Ruido"
      desc: "Odiamos la ineficiencia y el desorden."
    v3:
      title: "Omnipresencia Orgánica"
      desc: "Estamos donde el cliente está, sin ser invasivos."
    v4:
      title: "Estandarización de la Excelencia"
      desc: "La calidad de la atención no debe depender del humor del humano."
  personality:
    title: "Personalidad de Marca"
    items:
      p1:
        title: "Autoridad Técnica (El Sabio)"
        desc: "Habla con precisión. No “cree” que un lead es bueno, lo perfila con datos. Es una marca experta en eficiencia y flujos de trabajo."
      p2:
        title: "Simplicidad Sofisticada (El Mago)"
        desc: "La tecnología interna es compleja, pero la experiencia del usuario es mágica y fluida. Transforma el “ruido” en “oportunidades” de forma casi invisible."
      p3:
        title: "Empoderamiento Humano"
        desc: "No busca reemplazar al vendedor, sino convertirlo en un “super-cerrador”. Es una marca aliada, cálida en su trato pero implacable en su ejecución."
    slogan: "Nosotros gestionamos la complejidad; tú cierras el negocio."
  tone:
    title: "Tono y Voz"
    desc: "No somos un simple chatbot; somos una Infraestructura de Ventas. Somos el “cerebro” que filtra, califica y reactiva, permitiendo que los humanos se dediquen a cerrar."
