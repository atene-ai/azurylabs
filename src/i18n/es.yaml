faq:
  badge: "Preguntas frecuentes"
  title: "Lo que suelen preguntarnos<br /><span class='faq__title--accent'>sobre Azury Labs.</span>"
  items:
    - q: "¿Qué es Azury Labs?"
      a: "Azury Labs es una empresa de software especializada en inteligencia artificial aplicada. Construimos productos propios y soluciones a medida para que las empresas vendan, operen y decidan con datos. Tenemos presencia en México, Colombia y Estados Unidos."
    - q: "¿Qué productos ofrece Azury Labs?"
      a: "Ocho líneas: Atenea (agentes de IA para mensajes y voz en tiempo real), Lindex (ingeniería de software autónoma), Sales OS (CRM omnicanal), Mi Negocio (gestión de clientes, cotizaciones y órdenes), CIEE (encuestas e investigación), Systems (software a medida y consultoría), Connect (API oficial de WhatsApp) y Tracking System (analítica del primer contacto a la venta)."
    - q: "¿Qué es Iruz Atenea y en qué canales funciona?"
      a: "Atenea es la plataforma con la que creamos agentes de IA que atienden mensajes y voz en tiempo real, conocen tu negocio y se conectan a tus sistemas para ejecutar procesos reales. Se integra con WhatsApp Business, Telegram, Instagram Messenger, llamadas y Google Calendar."
    - q: "¿Qué es Lindex?"
      a: "Lindex es un harness de ingeniería de software autónoma: coordina agentes de IA desde un ticket hasta el código, las pruebas y un preview desplegado. Ejecuta en un entorno aislado, registra cada acción y permite definir un presupuesto máximo por tarea. Se conecta con Linear, Jira, GitHub, GitLab y Cloudflare Pages."
    - q: "¿Qué es Iruz Connect?"
      a: "Iruz Connect es la API oficial de WhatsApp para empresas y aplicaciones. Resuelve la integración con Meta, las credenciales, los webhooks y los estados de los mensajes para que tu equipo envíe y reciba mensajes de WhatsApp desde su propia plataforma o desde Atenea. Instagram, Messenger, SMS, RCS y voz son los próximos canales."
    - q: "¿Qué es Iruz Tracking System?"
      a: "Es analítica de producto que mide cada paso del cliente, del primer contacto a la venta. Con links rastreables y códigos QR ves qué campaña, canal o QR genera leads, citas y ventas, y en qué paso se pierden los clientes."
    - q: "¿En qué se diferencia Sales OS de un CRM tradicional?"
      a: "Sales OS conecta tus canales, agentes de IA y equipo humano en una sola conversación omnicanal para atender, calificar y dar seguimiento a cada oportunidad, en lugar de limitarse a registrar contactos."
    - q: "¿Azury Labs desarrolla software a medida?"
      a: "Sí. Iruz Systems diseña y desarrolla el software que tu operación necesita cuando una herramienta estándar ya no alcanza, con consultoría tecnológica e implementación acompañada."
    - q: "¿Cómo puedo empezar?"
      a: "Escríbenos desde la página de contacto o con el chat del sitio y cuéntanos el reto. Te orientamos hacia el producto o la solución a medida que mejor encaje."

