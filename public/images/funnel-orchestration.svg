  <rect x="170" y="570" width="320" height="160" rx="18" fill="rgba(255,255,255,0.05)" stroke="rgba(148,163,184,0.35)"/>
  <text x="198" y="610" fill="#E2E8F0" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="700">Lead Intake</text>
  <text x="198" y="646" fill="#94A3B8" font-family="Inter, Arial, sans-serif" font-size="18">8,420 interactions / day</text>
  <text x="198" y="678" fill="#94A3B8" font-family="Inter, Arial, sans-serif" font-size="18">Response latency &lt; 2.0s</text>

  <rect x="1110" y="570" width="320" height="160" rx="18" fill="rgba(255,255,255,0.05)" stroke="rgba(148,163,184,0.35)"/>
  <text x="1138" y="610" fill="#E2E8F0" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="700">Conversion Cell</text>
  <text x="1138" y="646" fill="#94A3B8" font-family="Inter, Arial, sans-serif" font-size="18">Qualified to close-ready: +29%</text>
  <text x="1138" y="678" fill="#94A3B8" font-family="Inter, Arial, sans-serif" font-size="18">SLA compliance: 98%</text>

  <text x="710" y="787" fill="#F8FAFC" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="700">Outcome Engine</text>
