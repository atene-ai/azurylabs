<svg width="1600" height="1000" viewBox="0 0 1600 1000" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="220" y1="120" x2="1380" y2="900" gradientUnits="userSpaceOnUse">
      <stop stop-color="#111827"/>
      <stop offset="1" stop-color="#0B1220"/>
    </linearGradient>
    <linearGradient id="funnelTop" x1="250" y1="220" x2="1350" y2="220" gradientUnits="userSpaceOnUse">
      <stop stop-color="#A78BFA" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#60A5FA" stop-opacity="0.85"/>
    </linearGradient>
    <linearGradient id="funnelMid" x1="450" y1="440" x2="1150" y2="640" gradientUnits="userSpaceOnUse">
      <stop stop-color="#C4B5FD" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#38BDF8" stop-opacity="0.8"/>
