  <g>
    <circle cx="300" cy="300" r="8" fill="#A78BFA"/>
    <circle cx="420" cy="300" r="8" fill="#A78BFA"/>
    <circle cx="520" cy="300" r="8" fill="#A78BFA"/>
    <circle cx="1120" cy="300" r="8" fill="#60A5FA"/>

    <circle cx="780" cy="520" r="10" fill="#C4B5FD"/>
    <circle cx="820" cy="520" r="10" fill="#93C5FD"/>
    <circle cx="900" cy="520" r="10" fill="#93C5FD"/>

