  <circle cx="164" cy="125" r="8" fill="#F59E0B"/>
  <circle cx="190" cy="125" r="8" fill="#10B981"/>
  <text x="230" y="132" fill="#CBD5E1" font-family="Inter, Arial, sans-serif" font-size="26" font-weight="600">Funnel Orchestration Map</text>

