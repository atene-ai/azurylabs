  <g opacity="0.9" stroke="url(#nodeLine)" stroke-width="3">
    <path d="M300 300 C540 330, 630 420, 800 520 C920 590, 970 660, 800 760"/>
    <path d="M420 300 C610 340, 740 430, 820 520 C880 590, 870 660, 810 760"/>
    <path d="M520 300 C700 350, 820 430, 900 520 C970 600, 930 680, 840 760"/>
    <path d="M1120 300 C970 350, 870 430, 820 520 C780 600, 770 660, 770 760"/>
