<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 268 56" role="img" aria-label="Microsoft AI Cloud Partner">
  <!-- Microsoft 4-square mark -->
  <g transform="translate(4, 13)">
    <rect x="0" y="0" width="13.5" height="13.5" fill="#F25022"/>
    <rect x="15.5" y="0" width="13.5" height="13.5" fill="#7FBA00"/>
    <rect x="0" y="15.5" width="13.5" height="13.5" fill="#00A4EF"/>
    <rect x="15.5" y="15.5" width="13.5" height="13.5" fill="#FFB900"/>
  </g>
  <!-- Brand name -->
  <text x="44" y="35" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="600" letter-spacing="-0.3" fill="#0F1E29">Microsoft</text>
  <!-- Subtle vertical divider -->
  <rect x="154" y="13" width="1.5" height="30" rx="0.75" fill="#0F1E29" opacity="0.22"/>
  <!-- Program designation -->
  <text x="167" y="26" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="14.5" font-weight="600" letter-spacing="0.1" fill="#0067B8">AI Cloud</text>
  <text x="167" y="42" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="14.5" font-weight="600" letter-spacing="0.1" fill="#0067B8">Partner</text>
</svg>
