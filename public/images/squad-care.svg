<svg width="1200" height="720" viewBox="0 0 1200 720" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Care Squad visual</title>
  <desc id="desc">Customer care multi-agent hub with channels, escalation, and quality skills.</desc>
  <defs>
    <linearGradient id="bg" x1="120" y1="80" x2="1080" y2="640" gradientUnits="userSpaceOnUse">
      <stop stop-color="#111827"/>
      <stop offset="1" stop-color="#1E1B4B"/>
    </linearGradient>
    <linearGradient id="hub" x1="600" y1="250" x2="600" y2="510" gradientUnits="userSpaceOnUse">
      <stop stop-color="#C4B5FD"/>
      <stop offset="1" stop-color="#818CF8"/>
    </linearGradient>
    <filter id="soft" x="0" y="0" width="1200" height="720" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="28"/>
    </filter>
  </defs>

  <rect x="24" y="24" width="1152" height="672" rx="36" fill="url(#bg)"/>
  <rect x="24" y="24" width="1152" height="672" rx="36" stroke="#3A3765"/>

  <rect x="100" y="92" width="1000" height="84" rx="18" fill="#211F3E" stroke="#4C4A7A"/>
  <text x="140" y="145" fill="#EDE9FE" font-family="Arial, sans-serif" font-size="34" font-weight="700">Care Squad Service Hub</text>

  <g opacity="0.22">
    <path d="M96 230H1104" stroke="#44406A"/>
    <path d="M96 320H1104" stroke="#44406A"/>
    <path d="M96 410H1104" stroke="#44406A"/>
    <path d="M96 500H1104" stroke="#44406A"/>
    <path d="M96 590H1104" stroke="#44406A"/>
  </g>

  <g>
    <circle cx="600" cy="366" r="102" fill="url(#hub)"/>
    <circle cx="600" cy="366" r="102" stroke="#DDD6FE" stroke-opacity="0.5"/>
    <text x="600" y="357" fill="#312E81" font-family="Arial, sans-serif" font-size="30" text-anchor="middle" font-weight="700">Agent Hub</text>
    <text x="600" y="392" fill="#312E81" font-family="Arial, sans-serif" font-size="24" text-anchor="middle">Routing + QA</text>

    <circle cx="310" cy="294" r="52" fill="#312E81" stroke="#A78BFA"/>
    <text x="310" y="302" fill="#EDE9FE" font-family="Arial, sans-serif" font-size="20" text-anchor="middle">Chat</text>

    <circle cx="890" cy="294" r="52" fill="#312E81" stroke="#A78BFA"/>
    <text x="890" y="302" fill="#EDE9FE" font-family="Arial, sans-serif" font-size="20" text-anchor="middle">Email</text>

    <circle cx="310" cy="466" r="52" fill="#312E81" stroke="#A78BFA"/>
    <text x="310" y="474" fill="#EDE9FE" font-family="Arial, sans-serif" font-size="20" text-anchor="middle">Voice</text>

    <circle cx="890" cy="466" r="52" fill="#312E81" stroke="#A78BFA"/>
    <text x="890" y="474" fill="#EDE9FE" font-family="Arial, sans-serif" font-size="20" text-anchor="middle">Tickets</text>

    <path d="M352 305L508 345" stroke="#A78BFA" stroke-width="3"/>
    <path d="M848 305L692 345" stroke="#A78BFA" stroke-width="3"/>
    <path d="M352 455L508 387" stroke="#A78BFA" stroke-width="3"/>
    <path d="M848 455L692 387" stroke="#A78BFA" stroke-width="3"/>
  </g>

  <g>
    <rect x="104" y="548" width="992" height="114" rx="16" fill="#211F3E" stroke="#4C4A7A"/>
    <text x="136" y="590" fill="#EDE9FE" font-family="Arial, sans-serif" font-size="28" font-weight="700">Skills</text>
    <text x="300" y="590" fill="#C4B5FD" font-family="Arial, sans-serif" font-size="24">Case resolution</text>
    <text x="520" y="590" fill="#C4B5FD" font-family="Arial, sans-serif" font-size="24">Smart escalation</text>
    <text x="754" y="590" fill="#C4B5FD" font-family="Arial, sans-serif" font-size="24">Knowledge retrieval</text>
    <text x="982" y="590" fill="#C4B5FD" font-family="Arial, sans-serif" font-size="24" text-anchor="end">SLA consistency</text>
  </g>

  <g filter="url(#soft)" opacity="0.22">
    <circle cx="602" cy="366" r="150" fill="#8B5CF6"/>
  </g>
